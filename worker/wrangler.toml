name = "learneasy-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
ENVIRONMENT = "production"
ADMIN_HOSTNAME = "admin.learneasy.ai"

[triggers]
crons = ["0 3 * * *"]  # daily at 3 AM UTC

[[d1_databases]]
binding = "DB"
database_name = "learneasy-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "learneasy-chunks"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "learneasy-pdfs"

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

# Static SPAs (built into worker/public/ by scripts/build-and-deploy.sh).
# The worker runs first so it can pick the student vs dashboard SPA by hostname.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Local dev: `wrangler dev --env dev`. Enables the ?tenant= / X-Tenant override.
# Bindings are not inherited by named environments, so they are redeclared here.
[env.dev.vars]
ENVIRONMENT = "development"
ADMIN_HOSTNAME = "admin.localhost:8787"

[env.dev.triggers]
crons = ["0 3 * * *"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "learneasy-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "learneasy-chunks"

[[env.dev.r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "learneasy-pdfs"

[env.dev.ai]
binding = "AI"

[env.dev.browser]
binding = "BROWSER"

[env.dev.assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Staging: `wrangler deploy --env staging`. Isolated D1/R2/Vectorize; AI and Browser are shared services.
# Replace the placeholder database_id after `wrangler d1 create learneasy-db-staging`.
[env.staging.vars]
ENVIRONMENT = "staging"
ADMIN_HOSTNAME = "admin-staging.learneasy.ai"

[env.staging.triggers]
crons = ["0 3 * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "learneasy-db-staging"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "learneasy-chunks-staging"

[[env.staging.r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "learneasy-pdfs-staging"

[env.staging.ai]
binding = "AI"

[env.staging.browser]
binding = "BROWSER"

[env.staging.assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
